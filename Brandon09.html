<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Database</title>
    <style>
     :root{
        --color-primario: #00ADD8;
        --color-secundario: #97CE4C;
        --color-terceario: #1B1B1B;
        --color-cuarto: #F9F9F9;
        --color-quinto: #FFD93D;
     }
     * {
        box-sizing: border-box;
     }
     body{
        background: linear-gradient(135deg, var(--color-primario) 0%, var(--color-secundario) 100%);
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
     }
     header{
        padding: 20px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--color-terceario);
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        margin-bottom: 30px;
     }
     #form {
        display: flex;
        align-items: center;
        gap: 20px;
     }
     .search{
        background-color: var(--color-cuarto);
        border: 3px solid var(--color-quinto);
        border-radius: 25px;
        font-family: inherit;
        font-size: 16px;
        padding: 12px 20px;
        color: var(--color-terceario);
        width: 300px;
        transition: all 0.3s;
        font-weight: bold;
     }
     .search::placeholder{
        color: var(--color-terceario);  
        opacity: 0.6;
        font-weight: normal;
     }
     .search:focus{
        outline: none;
        background-color: var(--color-quinto);
        border-color: var(--color-secundario);
        transform: scale(1.05);
     }
     main{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        padding: 20px;
        min-height: 80vh;
     }
     .character{
        width: 320px;
        background: var(--color-cuarto);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        margin: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.3s;
        border: 3px solid var(--color-quinto);
     }
     .character:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        border-color: var(--color-secundario);
     }
     .character img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-bottom: 3px solid var(--color-quinto);
     }
     .character-info{
        color: var(--color-terceario);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 20px 15px;
        background: var(--color-cuarto);
     }
     .character-info h3{
        color: var(--color-terceario);
        margin: 0 0 10px 0;
        font-size: 1.4em;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
     }
     .status {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: bold;
        text-transform: uppercase;
        margin: 5px 0;
     }
     .status.alive {
        background-color: var(--color-secundario);
        color: white;
     }
     .status.dead {
        background-color: #FF6B6B;
        color: white;
     }
     .status.unknown {
        background-color: #95A5A6;
        color: white;
     }
     .character-details {
        width: 100%;
        padding: 15px;
        background: var(--color-primario);
        color: white;
        text-align: center;
     }
     .character-details p {
        margin: 8px 0;
        font-size: 0.95em;
     }
     .character-details strong {
        color: var(--color-quinto);
        font-weight: bold;
     }
     .logo {
        width: 100px;
        height: auto;
        filter: brightness(1.2);
     }
    </style>
</head>
<body>
    <header>
        <form id="form" autocomplete="off">
            <h1 style="color: var(--color-quinto); margin: 0; font-size: 2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
                RICK & MORTY
            </h1>
            <input type="text" id="search" class="search" placeholder="Search Characters...">
        </form>
    </header>
    <main id="main"></main>
<script>
    const API_URL = 'https://rickandmortyapi.com/api/character';
    const main = document.getElementById('main');
    const form = document.getElementById('form');
    const search = document.getElementById('search');

    let allCharacters = [];
    getRickMorty(API_URL);

    async function getRickMorty(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network response was not ok');
            const data = await res.json();
            allCharacters = data.results || [];
            showRickMorty(allCharacters);
        } catch (error) {
            console.error('Error fetching characters:', error);
            main.innerHTML = '<p style="color: white; text-align: center; font-size: 1.2em;">Error loading characters. Please try again later.</p>';
        }
    }

    function showRickMorty(characters) {
        main.innerHTML = '';

        if (!characters || characters.length === 0) {
            main.innerHTML = '<p style="color: white; text-align: center; font-size: 1.2em;">No characters found.</p>';
            return;
        }

        characters.forEach((character) => {
            const { name, image, status, species, gender, origin, location } = character;

            const characterElement = document.createElement('div');
            characterElement.classList.add('character');

            characterElement.innerHTML = `
                <img src="${image}" alt="${name}">
                <div class="character-info">
                    <h3>${name}</h3>
                    <span class="status ${status.toLowerCase()}">${status}</span>
                </div>
                <div class="character-details">
                    <p><strong>Species:</strong> ${species || 'Unknown'}</p>
                    <p><strong>Gender:</strong> ${gender || 'Unknown'}</p>
                    <p><strong>Origin:</strong> ${origin?.name || 'Unknown'}</p>
                    <p><strong>Location:</strong> ${location?.name || 'Unknown'}</p>
                </div>
            `;

            main.appendChild(characterElement);
        });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const searchTerm = search.value.trim().toLowerCase();

        if (searchTerm && searchTerm !== '') {
            const filteredCharacters = allCharacters.filter(character =>
                character.name.toLowerCase().includes(searchTerm) ||
                character.species.toLowerCase().includes(searchTerm) ||
                character.status.toLowerCase().includes(searchTerm)
            );
            showRickMorty(filteredCharacters);
            search.value = '';
        } else {
            showRickMorty(allCharacters); 
        }
    });
</script>
</body>
</html>
